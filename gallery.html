<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Selfies</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fffaf0;
            --text-color: #444;
            --accent-pink: #ffb7c5;
        }

        body { 
            background: var(--bg-color); 
            margin: 0; 
            font-family: 'Varela Round', sans-serif; 
            color: var(--text-color); 
            overflow-x: hidden;
        }

        /* Intro Text Sequence */
        #gallery-intro {
            height: 100vh; width: 100vw; display: flex; align-items: center; 
            justify-content: center; position: fixed; top: 0; left: 0; 
            background: var(--bg-color); z-index: 2000;
        }
        .intro-phrase { 
            position: absolute; font-family: 'Caveat', cursive; 
            font-size: clamp(2rem, 8vw, 4rem); opacity: 0; text-align: center; width: 90%; 
        }

        /* Photo Display Styles */
        #main-gallery-content { opacity: 0; visibility: hidden; padding-top: 50px; }
        
        .photo-section {
            display: flex; flex-direction: column; align-items: center; gap: 100px;
            padding-bottom: 200px;
        }

        .photo-frame {
            width: 80%; max-width: 500px; /* Adjusted for 2252x4000 aspect ratio */
            background: white; padding: 15px 15px 60px 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transform: rotate(var(--r)); opacity: 0;
            transition: transform 0.5s ease;
        }
        .photo-frame:hover { transform: rotate(0deg) scale(1.02); z-index: 10; }

        .photo-frame img { width: 100%; height: auto; display: block; border-radius: 2px; }

        /* The Final Button */
        .final-trigger {
            height: 60vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
        }
        .next-btn {
            padding: 20px 60px; background: var(--accent-pink); color: white;
            border: none; border-radius: 50px; font-family: 'Caveat', cursive;
            font-size: 2rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 10px 25px rgba(255,183,197,0.5); transition: 0.3s;
        }
        .next-btn:hover { transform: translateY(-5px); background: #ffabbc; }
    </style>
</head>
<body>

    <div id="gallery-intro">
        <div class="intro-phrase" id="p1">sundar toh lgti h tu...</div>
        <div class="intro-phrase" id="p2">i feel like disturbing it actually....</div>
        <div class="intro-phrase" id="p3">lets revisit few of our selfies...</div>
        <div class="intro-phrase" id="p4">acchi wali...</div>
    </div>

    <div id="main-gallery-content">
        <div class="photo-section">
            <div class="photo-frame" style="--r: -3deg;"><img src="photos/photo1.jpg" alt="Memory 1"></div>
            <div class="photo-frame" style="--r: 2deg;"><img src="photos/photo2.jpg" alt="Memory 2"></div>
            <div class="photo-frame" style="--r: -2deg;"><img src="photos/photo3.jpg" alt="Memory 3"></div>
            <div class="photo-frame" style="--r: 4deg;"><img src="photos/photo4.jpg" alt="Memory 4"></div>
            <div class="photo-frame" style="--r: -4deg;"><img src="photos/photo5.jpg" alt="Memory 5"></div>
            <div class="photo-frame" style="--r: 1deg;"><img src="photos/photo6.jpg" alt="Memory 6"></div>
            <div class="photo-frame" style="--r: -3deg;"><img src="photos/photo7.jpg" alt="Memory 7"></div>
            <div class="photo-frame" style="--r: 2deg;"><img src="photos/photo8.jpg" alt="Memory 8"></div>
            <div class="photo-frame" style="--r: 3deg;"><img src="photos/photo9.jpg" alt="Memory 9"></div>
        </div>

        <div class="final-trigger">
            <h2 style="font-family: 'Caveat', cursive; font-size: 2.5rem; margin-bottom: 30px;">Ek aakhri cheez...</h2>
            <button class="next-btn" onclick="window.location.href='ask.html'">one final question...</button>
        </div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. Intro Animation Sequence
        const introTl = gsap.timeline({
            onComplete: () => {
                gsap.to("#gallery-intro", { opacity: 0, duration: 1, onComplete: () => {
                    document.getElementById('gallery-intro').style.display = 'none';
                    document.getElementById('main-gallery-content').style.opacity = 1;
                    document.getElementById('main-gallery-content').style.visibility = 'visible';
                }});
            }
        });

        introTl.to("#p1", { opacity: 1, duration: 1.5 })
               .to("#p1", { opacity: 0, duration: 0.8, delay: 1 })
               .to("#p2", { opacity: 1, duration: 1.5 })
               .to("#p2", { opacity: 0, duration: 0.8, delay: 1 })
               .to("#p3", { opacity: 1, duration: 1.5 })
               .to("#p3", { opacity: 0, duration: 0.8, delay: 1 })
               .to("#p4", { opacity: 1, duration: 1.5 })
               .to("#p4", { opacity: 0, duration: 0.8, delay: 1 });

        // 2. Photo Reveal on Scroll
        gsap.utils.toArray(".photo-frame").forEach((frame) => {
            gsap.to(frame, {
                opacity: 1,
                y: -50,
                scrollTrigger: {
                    trigger: frame,
                    start: "top 85%",
                    toggleActions: "play none none none"
                }
            });
        });
    </script>
</body>
</html>
